<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KIGER — Links</title>
    <meta name="description" content="Links oficiais da KIGER Produções Audiovisuais: site, YouTube, Instagram, WhatsApp e últimos lançamentos." />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="canonical" href="https://kiger-site.vercel.app/links" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="KIGER — Links" />
    <meta property="og:image" content="https://kiger-site.vercel.app/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

  <body class="links-page">
    <div class="grain" aria-hidden="true"></div>
    <main class="links" id="main">
      <div class="links__frame" aria-hidden="true">
        <span class="corner corner--tl"></span><span class="corner corner--tr"></span>
        <span class="corner corner--bl"></span><span class="corner corner--br"></span>
        <div class="hud hud--tr mono"><span class="rec"></span>REC</div>

      <header class="links__head">
        <span class="logo links__logo" role="img" aria-label="KIGER"></span>
        <p class="mono links__tag">Produtora audiovisual · São Paulo</p>
        <p class="links__bio serif">Onde propósitos ganham a cor do seu sonho.</p>
      </header>
      <nav class="links__list" id="linksList" aria-label="Links oficiais"></nav>
      <section class="links__team" aria-label="Equipe">
        <p class="mono links__label"><span class="tri tri--xs"><i></i><i></i><i></i></span>Equipe</p>
        <div class="links__avatars" id="avatars"></div>
      </section>
      <footer class="links__foot mono">© 2026 KIGER</footer>
    </main>
    <script type="module" src="/src/links.js"></script>
  </body>
</html>
